<div class="card" [class]="leader().region.toLowerCase()">
  <h3 class="card-title">{{ leader().name }}</h3>

  <div class="card-row">
    <div class="field-item">
      <span class="label">Region</span>
      <span class="value">{{ leader().region }}</span>
    </div>
    <div class="field-item">
      <span class="label">Town</span>
      <span class="value">{{ leader().town }}</span>
    </div>
  </div>

  <div class="card-row">
    <div class="field-item">
      <span class="label">Specialty</span>
      <span class="value">{{ leader().specialty }}</span>
    </div>
    <div class="field-item">
      <span class="label">Badge</span>
      <span class="value">{{ leader().badge }}</span>
    </div>
  </div>

  <div class="card-row single">
    <div class="field-item">
      <span class="label">Ace Level</span>
      <span class="value ace-level">{{ leader().aceLevel }}</span>
    </div>
  </div>

  @if (leader().motto) {
    <p class="motto">"{{ leader().motto }}"</p>
  }

  <div class="actions">
    <button (click)="edit.emit(leader()._id!)">Edit</button>
    <button class="delete" (click)="remove.emit(leader()._id!)">Remove</button>
  </div>
</div>
